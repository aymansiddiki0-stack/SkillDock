<!-- Skills field with previously selected chips, including a chip whose text
     lives only in the remove button's aria-label. -->
<div>
  <h3>Skills</h3>
  <div data-automation-id="multiselectInputContainer">
    <ul data-automation-id="selectedItemList">
      <li data-automation-id="selectedItem">
        <span>Python</span>
        <button aria-label="Remove Python">×</button>
      </li>
      <li data-automation-id="selectedItem">
        <span>Amazon Web Services (AWS)</span>
        <button aria-label="Remove Amazon Web Services (AWS)">×</button>
      </li>
      <li data-automation-id="selectedItem">
        <button aria-label="Delete C++">×</button>
      </li>
    </ul>
    <input type="text" aria-label="Skills" data-automation-id="searchBox" />
  </div>
  <p>Job description: strong Java and JavaScript skills required.</p>
</div>
